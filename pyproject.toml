[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diadocsdk-python"
version = "0.1.0"
description = "Python SDK for the Kontur.Diadoc API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSE-KONTUR"]
dependencies = ["httpx>=0.27,<1", "protobuf>=5,<8"]

[project.urls]
Repository = "https://github.com/natdev-t/diadocsdk-python"
"API documentation" = "https://developer.kontur.ru/doc/diadoc-api/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diadoc = ["_diadoc.pb", "py.typed"]
